# Graphiti MCP Server Configuration — overrides the image's baked-in default.
# Mounted read-only at /app/mcp/config/config.yaml by docker-compose.yml.
#
# Base structure copied verbatim from the verified upstream default
# (getzep/graphiti mcp_server/config/config.yaml, main branch, 2026-07-10).
#
# `graphiti.entity_types` below intentionally lists ONLY the upstream
# built-in types (Preference, Requirement, Procedure, Location, Event,
# Organization, Document, Topic, Person, Object) — no custom Decision/Outcome
# schema and no custom SUPERSEDES edge type. This layer is ambient
# progress-state memory, not a decision manager: reads/writes go by scope
# (group_id) + recency, and staleness relies on Graphiti's built-in
# bi-temporal invalidation rather than a typed schema. See
# docs/adr/0003-agentic-memory-progress-state.md for the reframe and
# rationale.
server:
  transport: "http" # Options: stdio, sse (deprecated), http
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "openai" # OpenAI-API-compatible; endpoint set by OPENAI_API_URL in infrastructure/.env.
  model: ${MODEL_NAME:gpt-5.5}
  max_tokens: 4096

  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:https://api.openai.com/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}

    azure_openai:
      api_key: ${AZURE_OPENAI_API_KEY}
      api_url: ${AZURE_OPENAI_ENDPOINT}
      api_version: ${AZURE_OPENAI_API_VERSION:2024-10-21}
      deployment_name: ${AZURE_OPENAI_DEPLOYMENT}
      use_azure_ad: ${USE_AZURE_AD:false}

    anthropic:
      api_key: ${ANTHROPIC_API_KEY}
      api_url: ${ANTHROPIC_API_URL:https://api.anthropic.com}
      max_retries: 3

    gemini:
      api_key: ${GOOGLE_API_KEY}
      project_id: ${GOOGLE_PROJECT_ID:}
      location: ${GOOGLE_LOCATION:us-central1}

    groq:
      api_key: ${GROQ_API_KEY}
      api_url: ${GROQ_API_URL:https://api.groq.com/openai/v1}

embedder:
  provider: "openai"
  model: ${EMBEDDER_MODEL:text-embedding-3-small}
  # Templated (not hardcoded) so it can be overridden per embedding model —
  # OpenAI text-embedding-3-small = 1536, Ollama nomic-embed-text = 768.
  dimensions: ${EMBEDDER_DIMENSIONS:1536}

  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      # Deliberately a DIFFERENT env var than llm.providers.openai.api_url above,
      # so the embedder can point at a different provider (e.g. local Ollama)
      # than the LLM extractor (e.g. a gateway with no /v1/embeddings route).
      # This config.yaml is parsed by the Graphiti MCP server's own config
      # loader (not docker-compose), whose ${VAR:default} syntax does not
      # support nesting another ${VAR} reference as the default — so this is a
      # plain literal default, not a fallback to OPENAI_API_URL. If
      # EMBEDDER_API_URL is unset, embeddings go to OpenAI's public API, not
      # wherever OPENAI_API_URL points. (docker-compose.yml passes this var
      # through with its own, separately-verified nesting against
      # OPENAI_API_URL — see that file's `environment:` block.)
      api_url: ${EMBEDDER_API_URL:https://api.openai.com/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}

    azure_openai:
      api_key: ${AZURE_OPENAI_API_KEY}
      api_url: ${AZURE_OPENAI_EMBEDDINGS_ENDPOINT}
      api_version: ${AZURE_OPENAI_API_VERSION:2024-10-21}
      deployment_name: ${AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT}
      use_azure_ad: ${USE_AZURE_AD:false}

    gemini:
      api_key: ${GOOGLE_API_KEY}
      project_id: ${GOOGLE_PROJECT_ID:}
      location: ${GOOGLE_LOCATION:us-central1}

    voyage:
      api_key: ${VOYAGE_API_KEY}
      api_url: ${VOYAGE_API_URL:https://api.voyageai.com/v1}
      model: "voyage-3"

database:
  provider: "falkordb" # Default: falkordb. Options: neo4j, falkordb

  providers:
    falkordb:
      uri: ${FALKORDB_URI:redis://localhost:6379}
      password: ${FALKORDB_PASSWORD:}
      database: ${FALKORDB_DATABASE:default_db}

    neo4j:
      uri: ${NEO4J_URI:bolt://localhost:7687}
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD}
      database: ${NEO4J_DATABASE:neo4j}
      use_parallel_runtime: ${USE_PARALLEL_RUNTIME:false}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:main}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:mcp_user}
  entity_types:
    # --- upstream built-ins (kept so default extraction behavior is unchanged) ---
    - name: "Preference"
      description: "User preferences, choices, opinions, or selections (PRIORITIZE over most other types except User/Assistant)"
    - name: "Requirement"
      description: "Specific needs, features, or functionality that must be fulfilled"
    - name: "Procedure"
      description: "Standard operating procedures and sequential instructions"
    - name: "Location"
      description: "Physical or virtual places where activities occur"
    - name: "Event"
      description: "Time-bound activities, occurrences, or experiences"
    - name: "Organization"
      description: "Companies, institutions, groups, or formal entities"
    - name: "Document"
      description: "Information content in various forms (books, articles, reports, etc.)"
    - name: "Topic"
      description: "Subject of conversation, interest, or knowledge domain (use as last resort)"
    - name: "Person"
      description: "An individual human referenced in the content"
    - name: "Object"
      description: "Physical items, tools, devices, or possessions (use as last resort)"
