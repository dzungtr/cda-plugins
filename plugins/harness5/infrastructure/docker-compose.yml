# Observability stack (ADR 0004).
#
# The previous backend and intermediary `otelcol` collector have been removed;
# telemetry from Claude Code now goes straight to signoz-otel-collector's
# in-network OTLP receiver.
services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd:z
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - milvus_minio_data:/minio_data:z
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0-beta
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    # milvus image runs as uid 999; bind-mounted volume is owned by the host
    # user, so the non-root process cannot mkdir /var/lib/milvus/data.
    user: root
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      ETCD_USE_AUTH: "false"
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus:z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - milvus-minio

  # Memgraph – graph DB for graphsearch (codebase relationship indexing)
  # Bolt: bolt://localhost:7687  |  Lab UI: http://localhost:3000 (inside container only)
  # HTTP monitoring: http://localhost:7444
  memgraph:
    container_name: memgraph
    image: memgraph/memgraph:latest
    restart: unless-stopped
    # memgraph image runs as uid 101 (memgraph); bind mounts owned by the host
    # user cause a SIGSEGV (exit 139) when the non-root process cannot write.
    # Run as root so the container can write to the bind-mounted volumes.
    user: root
    command:
      [
        "--also-log-to-stderr=true",
        "--log-level=INFO",
        "--bolt-port=7687",
        "--monitoring-port=7444",
        "--storage-mode=IN_MEMORY_TRANSACTIONAL",
        "--storage-wal-enabled=true",
        "--storage-snapshot-interval-sec=300",
        "--storage-snapshot-on-exit=true",
      ]
    ports:
      - "7687:7687" # Bolt protocol
      - "3014:3000" # Bolt protocol
      - "7444:7444" # HTTP monitoring
    volumes:
      - memgraph_data:/var/lib/memgraph:z
      - memgraph_log:/var/log/memgraph:z
      - memgraph_etc:/etc/memgraph:z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'RETURN 1;' | mgconsole --host localhost --port 7687",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Graphiti temporal knowledge-graph memory layer, exposed as the `memory`
  # MCP server (see skills/agentic-memory-read/SKILL.md). Uses the upstream
  # combined container (FalkorDB + MCP server bundled together) rather than
  # separate `falkordb` + `graphiti-mcp` services — see docs/adr/0005 and
  # infrastructure/config.yaml for the entity-type schema this reads.
  #
  # LLM extraction + embeddings call the OpenAI-compatible endpoints supplied
  # through infrastructure/.env; no model gateway runs in this stack.
  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:1.0.2
    container_name: mem-graphiti-mcp
    restart: unless-stopped
    environment:
      # --- FalkorDB (bundled in this same container) ---
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      BROWSER: ${FALKORDB_BROWSER_ENABLED:-1} # 1 = enable FalkorDB Browser UI, 0 = disable
      FALKORDB_URI: redis://localhost:6379 # internal — combined container talks to itself
      FALKORDB_DATABASE: ${FALKORDB_DATABASE:-default_db}

      # --- Graphiti graph namespace ---
      # Per-call group_id (see skills/agentic-memory-read/SKILL.md) overrides this default;
      # this is only the fallback when a tool call omits group_id/group_ids.
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-main}

      # --- LLM + embeddings for entity/edge extraction ---
      # Supplied explicitly by infrastructure/.env. OPENAI_BASE_URL mirrors
      # OPENAI_API_URL so config.yaml's llm.providers.openai.api_url (which
      # reads OPENAI_API_URL) and the OpenAI SDK base URL stay in sync.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY required (see infrastructure/.env)}
      OPENAI_API_URL: ${OPENAI_API_URL:?OPENAI_API_URL required (see infrastructure/.env)}
      # graphiti_core's LLM client wraps the official OpenAI SDK, which only
      # honors the SDK's own OPENAI_BASE_URL env var for the base URL — it does
      # NOT read the custom OPENAI_API_URL name above.
      OPENAI_BASE_URL: ${OPENAI_API_URL:?OPENAI_API_URL required (see infrastructure/.env)}
      MODEL_NAME: ${MEM_EXTRACTOR_MODEL:-claude-haiku-4-5}
      EMBEDDER_MODEL: ${MEM_EMBED_MODEL:-text-embedding-3-small}
      # Embedder endpoint decoupled from the LLM endpoint above — lets
      # embeddings go to a different provider (e.g. local Ollama) than the
      # LLM extractor.
      EMBEDDER_API_URL: ${EMBEDDER_API_URL:?EMBEDDER_API_URL required (see infrastructure/.env)}
      EMBEDDER_DIMENSIONS: ${EMBEDDER_DIMENSIONS:-1536}

      # --- ingestion concurrency (tune to the upstream provider's rate limit) ---
      SEMAPHORE_LIMIT: ${SEMAPHORE_LIMIT:-5}

      # --- points the server at our entity-type config below ---
      CONFIG_PATH: /app/mcp/config/config.yaml
      PATH: /root/.local/bin:${PATH}
    volumes:
      - falkordb_data:/var/lib/falkordb/data
      - mcp_logs:/var/log/graphiti
      # Overrides the image's baked-in config.yaml. We register only the upstream
      # built-in entity types and rely on scope+recency retrieval + Graphiti's
      # bi-temporal invalidation — no custom decision schema (see docs/adr/0005).
      - ./config.yaml:/app/mcp/config/config.yaml:ro,z
    ports:
      - "${GRAPHITI_MCP_HTTP_PORT:-8121}:8000" # MCP HTTP endpoint at /mcp/
      - "${FALKORDB_REDIS_PORT:-6380}:6379" # FalkorDB/Redis
      - "${FALKORDB_BROWSER_PORT:-3010}:3000" # FalkorDB browser UI (optional)
    extra_hosts:
      # Lets EMBEDDER_API_URL point at a local Ollama on the host (e.g.
      # http://host.docker.internal:11434/v1); not needed for cloud providers.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # SigNoz — observability backend chosen in ADR 0004. Vendored from the
  # official docker-compose distribution at tag v0.129.0, the last release to
  # ship deploy/docker/ (upstream has since replaced the bundled compose with
  # Foundry). Config files live under ./signoz/. Claude Code's own OTLP
  # export is repointed at this collector (see settings.json).
  #
  # UI:   http://localhost:8080            (SIGNOZ_UI_PORT)
  # OTLP: grpc://127.0.0.1:4317            (SIGNOZ_OTLP_GRPC_PORT)
  #       http://127.0.0.1:4318            (SIGNOZ_OTLP_HTTP_PORT)
  #       — standard 4317/4318 reclaimed now that the intermediary `otelcol`
  #       collector (which historically bound them) is fully removed.

  # One-shot: fetches the histogramQuantile UDF binary ClickHouse needs.
  signoz-init-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: signoz-init-clickhouse
    restart: on-failure
    command:
      - bash
      - -c
      - |
        dest=/var/lib/clickhouse/user_scripts/histogramQuantile
        if [ -x "$$dest" ]; then
          echo "histogramQuantile already present at $$dest — skipping download"
          exit 0
        fi
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile "$$dest"
    volumes:
      - signoz_clickhouse_user_scripts:/var/lib/clickhouse/user_scripts:z

  signoz-zookeeper:
    image: signoz/zookeeper:3.7.1
    container_name: signoz-zookeeper
    restart: unless-stopped
    user: root
    labels:
      signoz.io/scrape: "true"
      signoz.io/port: "9141"
      signoz.io/path: /metrics
    environment:
      ZOO_SERVER_ID: "1"
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_AUTOPURGE_INTERVAL: "1"
      ZOO_ENABLE_PROMETHEUS_METRICS: "yes"
      ZOO_PROMETHEUS_METRICS_PORT_NUMBER: "9141"
    volumes:
      - signoz_zookeeper_data:/bitnami/zookeeper
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  signoz-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: signoz-clickhouse
    restart: unless-stopped
    tty: true
    depends_on:
      signoz-init-clickhouse:
        condition: service_completed_successfully
      signoz-zookeeper:
        condition: service_healthy
    labels:
      signoz.io/scrape: "true"
      signoz.io/port: "9363"
      signoz.io/path: /metrics
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./signoz/clickhouse/config.xml:/etc/clickhouse-server/config.xml:ro,z
      - ./signoz/clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro,z
      - ./signoz/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml:ro,z
      - ./signoz/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro,z
      - signoz_clickhouse_user_scripts:/var/lib/clickhouse/user_scripts:z
      - signoz_clickhouse_data:/var/lib/clickhouse:z
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Query service + UI (combined upstream image).
  signoz:
    image: signoz/signoz:${SIGNOZ_VERSION:-v0.129.0}
    container_name: signoz
    restart: unless-stopped
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    ports:
      - "${SIGNOZ_UI_PORT:-8080}:8080"
    environment:
      SIGNOZ_ALERTMANAGER_PROVIDER: signoz
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      SIGNOZ_TOKENIZER_JWT_SECRET: ${SIGNOZ_JWT_SECRET:-local-dev-signoz-jwt}
      # Impersonation mode (no-auth) — every request is treated as the root
      # admin user; no login screen, no sessions, no API keys. All three
      # identn toggles are required together (SigNoz impersonation-mode docs).
      SIGNOZ_IDENTN_IMPERSONATION_ENABLED: "true"
      SIGNOZ_IDENTN_TOKENIZER_ENABLED: "false"
      SIGNOZ_IDENTN_APIKEY_ENABLED: "false"
      # Root user provisioning — impersonation acts as this user. Auto-creates
      # the org + root user on startup, which also disables /register
      # self-signup (removes the first-signup gate that was blocking OTLP).
      SIGNOZ_USER_ROOT_ENABLED: "true"
      SIGNOZ_USER_ROOT_EMAIL: ${SIGNOZ_USER_ROOT_EMAIL:-admin@local.dev}
      SIGNOZ_USER_ROOT_PASSWORD: ${SIGNOZ_USER_ROOT_PASSWORD:-SignozLocalDev123!}
      SIGNOZ_USER_ROOT_ORG_NAME: ${SIGNOZ_USER_ROOT_ORG_NAME:-default}
    volumes:
      - signoz_sqlite_data:/var/lib/signoz/
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Official SigNoz MCP server, HTTP transport. Talks to `signoz` in-network
  # (not the host-published port); its own HTTP endpoint is published
  # loopback-only, matching every other service here, since it runs with no
  # OAuth (backend impersonation mode already covers auth for this local dev
  # stack). Backs the `cc-observability` MCP server (see .mcp.json).
  signoz-mcp:
    image: signoz/signoz-mcp-server:${SIGNOZ_MCP_SERVER_TAG:-v0.8.0}
    container_name: signoz-mcp
    restart: unless-stopped
    depends_on:
      signoz:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SIGNOZ_MCP_HTTP_PORT:-3018}:8000"
    environment:
      TRANSPORT_MODE: http
      MCP_SERVER_PORT: "8000"
      SIGNOZ_URL: http://signoz:8080
      SIGNOZ_API_KEY: ${SIGNOZ_MCP_API_KEY:-not-required-impersonation-mode}
      LOG_LEVEL: ${SIGNOZ_MCP_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8000/livez"]
      interval: 30s
      timeout: 5s
      retries: 3

  # One-shot: creates/updates the signoz_* ClickHouse schemas. The collector
  # below gates its own start on `migrate sync check`, so ordering is safe.
  signoz-schema-migrator:
    image: signoz/signoz-otel-collector:${SIGNOZ_OTELCOL_TAG:-v0.144.5}
    container_name: signoz-schema-migrator
    restart: on-failure
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:${SIGNOZ_OTELCOL_TAG:-v0.144.5}
    container_name: signoz-otel-collector
    restart: unless-stopped
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/manager-config.yaml --copy-path=/var/tmp/collector-config.yaml
    environment:
      OTEL_RESOURCE_ATTRIBUTES: host.name=signoz-host,os.type=linux
      LOW_CARDINAL_EXCEPTION_GROUPING: "false"
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    volumes:
      - ./signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro,z
      - ./signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml:ro,z
    ports:
      - "127.0.0.1:${SIGNOZ_OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC receiver
      - "127.0.0.1:${SIGNOZ_OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP receiver

volumes:
  falkordb_data:
    driver: local
  mcp_logs:
    driver: local
  signoz_clickhouse_data:
    driver: local
  signoz_clickhouse_user_scripts:
    driver: local
  signoz_zookeeper_data:
    driver: local
  signoz_sqlite_data:
    driver: local
  etcd_data:
    driver: local
  milvus_minio_data:
    driver: local
  milvus_data:
    driver: local
  memgraph_data:
    driver: local
  memgraph_log:
    driver: local
  memgraph_etc:
    driver: local

